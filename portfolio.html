potify.", "One piece of content, three channels. Each episode was planned once, aired live on radio, streamed on Facebook Live at the same time, and then uploaded to Spotify as a podcast episode.": "Un contenido, tres canales. Cada episodio se planificaba una vez, se emitía en directo por radio, se retransmitía a la vez por Facebook Live y después se subía a Spotify como episodio de pódcast.", "A recurring financial-education show, available live and on demand.": "Un programa periódico de educación financiera, disponible en directo y a la carta.", "Presentation Design": "Diseño de presentaciones", "neo.b Labs grows through exclusive distributors, so the first meeting with a potential partner has to explain the company, its products and what it expects from them.": "neo.b Labs crece a través de distribuidores exclusivos, así que la primera reunión con un posible partner tiene que explicar la empresa, sus productos y lo que espera de ellos.", "Tell a clear company story, from mission to product lines, territories and target, in a few slides.": "Contar una historia de empresa clara, de la misión a las líneas de producto, territorios y público objetivo, en pocas diapositivas.", "Wrote the structure and messages and designed the full deck.": "Redacté la estructura y los mensajes y diseñé la presentación completa.", "A 12-slide deck: who we are, mission and vision, values, territories, formulas, product lines, target audiences and the partner profile, built on the neo.b Labs visual system.": "Una presentación de 12 diapositivas: quiénes somos, misión y visión, valores, territorios, fórmulas, líneas de producto, públicos objetivo y perfil de partner, construida sobre el sistema visual de neo.b Labs.", "A presentation the team uses with distributors and partners when introducing the brand.": "Una presentación que el equipo usa con distribuidores y partners para presentar la marca.", "Presentation Design · Training": "Diseño de presentaciones · Formación", "neo.b Labs trains  "La presentación usada en el webinar de Hyboost y NAD para médicos en Colombia.", "Presentation Design · Investors": "Diseño de presentaciones · Inversores", "Real Tokn, a regulated platform that tokenizes real estate in Central America, needed to present itself to investors and issuers.": "Real Tokn, una plataforma regulada que tokeniza inmuebles en Centroamérica, necesitaba presentarse ante inversores y emisores.", "Explain a new, technical idea simply and make the business case convincing.": "Explicar una idea nueva y técnica de forma sencilla y hacer convincente el caso de negocio.", "Freelance designer: deck design within the Real Tokn identity.": "Diseñadora freelance: diseño de la presentación dentro de la identidad de Real Tokn.", "A 13-slide deck built on the brand’s dark navy and green system: who we are, target, market problem, solution, market size, competitive advantages and business model.": "Una presentación de 13 diapositivas sobre el sistema de azul marino y verde de la marca: quiénes somos, público objetivo, problema del mercado, solución, tamaño del mercado, ventajas competitivas y modelo de negocio.", "An investment deck used to present Real Tokn to investors and issuers.": "Una presentación para inversores usada para presentar Real Tokn a inversores y emisores.", "Branding · Brand guidelines": "Branding · Manual de marca", "As neo.b Labs grew across 12 territories, the team, distributors and agencies needed one source for how the brand looks and speaks.": "Con neo.b Labs creciendo en 12 territorios, el equipo, los distribuidores y las agencias necesitaban una única referencia de cómo se ve y cómo habla la marca.", "Define a premium identity that feels medical yet warm, and make it easy to apply in every market.": "Definir una identidad premium, médica pero cercana, y fácil de aplicar en cada mercado.", "Developed and designed the brand guidelines.": "Desarrollé y diseñé el manual de marca.", "A 28-page brandbook: mission, values and positioning, logo with safe area and colour versions, the tagline “Enhancing your skin, revealing your beauty”, look and feel, colour palette, typography (Playfair Display and Poppins), brand message, and social media and packaging applications.": "Un brandbook de 28 páginas: misión, valores y posicionamiento, logo con área de seguridad y versiones de color, el claim “Enhancing your skin, revealing your beauty”, look and feel, paleta de color, tipografía (Playfair Display y Poppins), mensaje de marca y aplicaciones en redes sociales y packaging.", "One reference for the team, distributors and partners, applied across packaging, catalogues and social media.": "Una referencia única para el equipo, los distribuidores y los partners, aplicada en packaging, catálogos y redes sociales.", "Real Tokn needed one reference so every launch, post and presentation looked like the same brand.": "Real Tokn necesitaba una referencia única para que cada lanzamiento, publicación y presentación pareciera de la misma marca.", "Turn a new identity into simple rules that the marketing and sales teams could follow.": "Convertir una identidad nueva en reglas sencillas que los equipos de marketing y ventas pudieran seguir.", "Freelance designer: created the identity, then wrote and designed the manual.": "Diseñadora freelance: creé la identidad y después redacté y diseñé el manual.", "A manual covering logo variations for light and dark backgrounds, typography, the colour palette with its codes, graphic elements and social media templates.": "Un manual con variaciones del logo para fondos claros y oscuros, tipografía, paleta de color con sus códigos, elementos gráficos y plantillas para redes sociales.", "A clear set of rules used across Real Tokn’s social media, campaigns and decks.": "Un conjunto claro de reglas usado en las redes sociales, campañas y presentaciones de Real Tokn.", "Product Design · Workshop": "Diseño de producto · Taller", "A one-week workshop at WantedDesign in New York with students from different countries and disciplines. The brief: design a product that expresses the word “Playfulness”.": "Un taller de una semana en WantedDesign, en Nueva York, con estudiantes de distintos países y disciplinas. El encargo: diseñar un producto que exprese la palabra “Playfulness”.", "Agree on one idea across cultures and disciplines, starting online and finishing in person, while learning new materials on site.": "Acordar una única idea entre culturas y disciplinas, empezando online y terminando en persona, mientras aprendíamos nuevos materiales sobre la marcha.", "Designer in a five-person international team (Fátima Safie, Monteserrat Pazos, Behnia Rahmati, Roman Weil and Dario Vidal): research, ideation and prototyping.": "Diseñadora en un equipo internacional de cinco personas (Fátima Safie, Monteserrat Pazos, Behnia Rahmati, Roman Weil y Dario Vidal): investigación, ideación y prototipado.", "Research on existing products across the team’s cultures, ideation criteria, sketches, material selection, cardboard prototypes and renders. The result was “Bull”: a balancing bench that only works when two people use it together.": "Investigación de productos existentes en las culturas del equipo, criterios de ideación, bocetos, selección de materiales, prototipos en cartón y renders. El resultado fue “Bull”: un banco balancín que solo funciona cuando lo usan dos personas a la vez.", "A finished prototype of a park bench for young people and adults, designed to help strangers talk and make friends.": "Un prototipo terminado de banco de parque para jóvenes y adultos, diseñado para que desconocidos conversen y hagan amigos.", "ICFF New York · ECMH + Universidad Don Bosco": "ICFF Nueva York · ECMH + Universidad Don Bosco", "Product Design · Design Thinking": "Diseño de producto · Design Thinking", "A joint project between Strategic Design students at Escuela de Comunicación Mónica Herrera and Industrial Design students at Universidad Don Bosco, on the theme Design gy · Multichannel growth": "Brand & Marketing Manager · Estrategia de marca · Crecimiento multicanal", "Brand & Marketing Manager with a creative background and 7+ years in communication, marketing and advertising. Started in strategic planning at APEX BBDO and has built brand strategies, positioning and value propositions in financial services and medical aesthetics. Currently leading marketing for an international brand present in 12 markets. Master's in Marketing & Commercial Management; Bachelor's in Strategic Design.": "Brand & Marketing Manager con perfil creativo y más de 7 años de experiencia en comunicación, marketing y publicidad. Empecé en planificación estratégica en APEX BBDO y he desarrollado estrategias de marca, posicionamiento y propuestas de valor en servicios financieros y medicina estética. Actualmente lidero el marketing de una marca internacional presente en 12 mercados. Máster en Marketing y Dirección Comercial; Grado en Diseño Estratégico.", "Design: Illustrator, Photoshop, InDesign, Premiere Pro, Canva · AI: ChatGPT, Claude, Canva AI · Marketing & data: HubSpot, Meta Business Suite, Google Analytics, WordPress, Excel · Planning: Notion, Asana, Trello, PowerPoint, Keynote": "Diseño: Illustrator, Photoshop, InDesign, Premiere Pro, Canva · IA: ChatGPT, Claude, Canva AI · Marketing y datos: HubSpot, Meta Business Suite, Google Analytics, WordPress, Excel · Planificación: Notion, Asana, Trello, PowerPoint, Keynote", "neo.b Labs sells hyaluronic acid boosters, sterile cosmetics and CE-marked medical devices to clinics through distributors in 12 markets.": "neo.b Labs vende boosters de ácido hialurónico, cosméticos estériles y productos sanitarios con marcado CE a clínicas a través de distribuidores en 12 mercados.", "Help distributors in 12 markets explain a technical, regulated portfolio with the same message doctors hear.": "Ayudar a los distribuidores de 12 mercados a explicar una cartera técnica y regulada con el mismo mensaje que escuchan los am Insights, 15 Feb – 16 Mar 2026.": "Punto de partida: Instagram Insights, 15 feb. – 16 mar. 2026.", "What I learned": "Qué aprendí", "Start from the audience, not the product: 87% of followers are women and 25–44 is the largest age group. Next: a monthly KPI dashboard to track progress towards 10K.": "Empezar por la audiencia, no por el producto: el 87% de los seguidores son mujeres y el grupo de 25–44 años es el más numeroso. Siguiente paso: un dashboard mensual de KPIs para seguir el avance hacia los 10K.", "Target · 12 months from April 2026": "Objetivo · 12 meses desde abril de 2026", "A wealth-management firm where trust drives every client decision needed a brand aligned with its business goals and a consistent presence across channels.": "Una firma de gestión patrimonial, donde la confianza guía cada decisión del cliente, necesitaba una marca alineada con sus objetivos de negocio y una presencia coherente en todos los canales.", "Brand positioning, the communication plan, the social media line, 10+ financial-education events end to end and the radio show.": "El posicionamiento de marca, el plan de comunicación, la línea de redes sociales, más de 10 eventos de educación financiera de principio a fin y el programa de radio.", "The Fisherman logo and brand identity, social media content and printed materials.": "El logotipo y la identidad de marca de Fisherman, los contenidos de redes sociales y los materiales impresos.", "Digital agencies and media partners, coordinated by me.": "Agencias digitales y medios colaboradores, coordinados por mí.", "Position the brand through financial education instead of product selling.": "Posicionar la marca a través de la educación financiera en lugar de la venta de producto.", "Use one content line across social media, print, events and radio.": "Usar una única línea de contenidos en redes sociales, impresos, eventos y radio.", "Build a repeatable event format for both the public and companies.": "Crear un formato de evento <script>
(function(){
  const LANG = (() => { try { return localStorage.getItem('fs-lang') === 'es' ? 'es' : 'en'; } catch(e) { return 'en'; } })();
  const DRAFT = 'fs-edits-draft-' + location.pathname;
  const BL = 'h1,h2,h3,h4,p,li,dt,dd,blockquote,figcaption';
  const SP = 'span.label,span.res,span.muted,span.val,span.vis-note';
  const NO = 'button,input,select,textarea,video,img,svg,iframe';
  const norm = h => h.trim().replace(/ style="[^"]*"/g,'').replace(/ (contenteditable|data-fs-[a-z-]+|spellcheck)="[^"]*"/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');
  const clean = h => norm(h.replace(/(<br\s*\/?>\s*)+$/,'').replace(/<div>/g,'<br>').replace(/<\/div>/g,''));
  let saved = {en:{}, es:{}}, pending = {}, editing = false, art = null, busy = false, assets = null, media = {}, mpend = null;
  try { const d = JSON.parse(sessionStorage.getItem(DRAFT) || localStorage.getItem(DRAFT) || 'null'); if (d && d.lang === LANG) { pending = d.p || {}; mpend = d.m || null; } } catch(e) {}
  const applyMedia = () => { if (window.__fsMedia) window.__fsMedia(mpend || media, LANG); };
  const roots = () => ['main','footer'].map(s => document.querySelector(s)).filter(Boolean);
  const cur = () => Object.assign({}, saved[LANG] || {}, pending);
  const FMT = new Set(['B','STRONG','I','EM','MARK','BR','SMALL','SUP','SUB','SPAN','U','S','A','ABBR','TIME']);
  function leafy(el){
    for (const d of el.querySelectorAll('*')) if (!FMT.has(d.tagName) || d.matches(NO)) return false;
    return true;
  }
  function ownText(el){ for (const n of el.childNodes) if (n.nodeType === 3 && n.textContent.trim()) return true; return false; }
  function cands(){
    const out = [];
    for (const r of roots()) {
      const all = r.querySelectorAll('*');
      for (const el of all) {
        if (el.matches(NO) || el.closest('button,.fs-edbar,nav,[aria-hidden="true"],[data-fs-x],.fs-mtools,.fs-madd')) continue;
        if (FMT.has(el.tagName) && el.tagName !== 'SPAN' && el.tagName !== 'A') continue;
        if (!el.textContent.trim() || !leafy(el)) continue;
        if (!el.matches(BL) && !ownText(el)) continue;
        let a = el.parentElement, inside = false;
        while (a && a !== r) { if (a.__fsC) { inside = true; break; } a = a.parentElement; }
        if (inside) continue;
        el.__fsC = true; out.push(el);
      }
      for (const el of out) delete el.__fsC;
    }
    return out;
  }
  let scheduled = false;
  function scan(){
    scheduled = false;
    const ov = cur();
    for (const el of cands()) {
      if (!el.dataset.fsLock || !el.dataset.fsKey) el.dataset.fsKey = norm(el.innerHTML);
      const key = el.dataset.fsKey, want = ov[key];
      if (want !== undefined && el !== document.activeElement && norm(el.innerHTML) !== want) { el.dataset.fsLock = '1'; el.innerHTML = want; }
      if (editing) { if (el.getAttribute('contenteditable') !== 'true') { el.setAttribute('contenteditable','true'); el.setAttribute('spellcheck','true'); el.setAttribute('data-fs-ed',''); } }
      else if (el.hasAttribute('data-fs-ed')) { el.removeAttribute('contenteditable'); el.removeAttribute('spellcheck'); el.removeAttribute('data-fs-ed'); }
      if (pending[key] !== undefined) el.setAttribute('data-fs-dirty',''); else el.removeAttribute('data-fs-dirty');
    }
    deco();
  }
  const T = {en:{cover:'Set as cover',rm:'Remove',add:'+ Add images or videos',pt:'+ Add point',np:'New point',up:'Uploading…',cv:'Cover',chg:'Change image',rst:'Original'},
             es:{cover:'Usar de portada',rm:'Quitar',add:'+ Agregar imágenes o vídeos',pt:'+ Agregar punto',np:'Nuevo punto',up:'Subiendo…',cv:'Portada',chg:'Cambiar imagen',rst:'Original'}}[LANG];
  function deco(){
    const page = document.querySelector('main .cs2[data-pid]');
    if (!editing) {
      document.querySelectorAll('.fs-mtools,.fs-madd').forEach(x => x.remove());
      document.querySelectorAll('[data-fs-x][contenteditable]').forEach(x => x.removeAttribute('contenteditable'));
      return;
    }
    if (assets) {
      document.querySelectorAll('main .rh-p[data-dk] .ph, main .dp-img[data-dk]').forEach(f => {
        if (f.querySelector('.fs-mtools')) return;
        const dk = (f.closest('[data-dk]') || f).dataset.dk;
        f.insertAdjacentHTML('beforeend', `<div class="fs-mtools"><button type="button" data-fs-m="dimg" data-dk="${dk}">${T.chg}</button>${((mpend || media).__disc || {})[dk] ? `<button type="button" data-fs-m="dreset" data-dk="${dk}">${T.rst}</button>` : ''}</div>`);
      });
      if (!document.getElementById('fs-file1')) document.body.insertAdjacentHTML('beforeend', '<input type="file" class="fs-madd" id="fs-file1" accept="image/*" hidden>');
    }
    if (!page) return;
    const pid = page.dataset.pid, cover = ((mpend || media)[pid] || {}).cover;
    page.querySelectorAll('.gallery figure[data-src]').forEach(f => {
      if (f.querySelector('.fs-mtools')) return;
      const img = !f.classList.contains('is-video'), on = cover === f.dataset.src;
      f.insertAdjacentHTML('beforeend', `<div class="fs-mtools">${img ? `<button type="button" data-fs-m="cover"${on ? ' disabled' : ''}>${on ? T.cv + ' ✓' : T.cover}</button>` : ''}<button type="button" data-fs-m="rm">${T.rm}</button></div>`);
    });
    const gw = page.querySelector('.gal .wrap');
    if (gw && assets && !gw.querySelector('.fs-madd')) gw.insertAdjacentHTML('beforeend', `<button type="button" class="fs-madd" data-fs-m="add">${T.add}</button><input type="file" class="fs-madd" id="fs-file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple hidden>`);
    const did = [...page.querySelectorAll('.core .cc')][1];
    if (did && !page.querySelector('.fs-madd[data-fs-m="pt"]')) did.insertAdjacentHTML('beforeend', `<button type="button" class="fs-madd fs-pt" data-fs-m="pt">${T.pt}</button>`);
    page.querySelectorAll('[data-fs-x]').forEach(li => { if (li.getAttribute('contenteditable') !== 'true') { li.setAttribute('contenteditable','true'); li.setAttribute('spellcheck','true'); } });
  }
  function M(pid){ if (!mpend) mpend = JSON.parse(JSON.stringify(media)); return mpend[pid] || (mpend[pid] = {}); }
  function mchanged(){ applyMedia(); stash(); ui(); }
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-fs-m]'); if (!b || !editing) return;
    e.preventDefault(); e.stopPropagation();
    if (b.dataset.fsM === 'dimg') { const inp = document.getElementById('fs-file1'); if (inp) { inp.dataset.dk = b.dataset.dk; inp.click(); } return; }
    if (b.dataset.fsM === 'dreset') { delete M('__disc')[b.dataset.dk]; mchanged(); return; }
    const page = document.querySelector('main .cs2[data-pid]'); if (!page) return;
    const pid = page.dataset.pid, act = b.dataset.fsM, src = b.closest('figure') && b.closest('figure').dataset.src;
    if (act === 'cover' && src) { M(pid).cover = src; mchanged(); }
    else if (act === 'rm' && src) { const m = M(pid), add = m.add || [], i = add.findIndex(a => a.u === src);
      if (i >= 0) add.splice(i, 1); else (m.hide = m.hide || []).push(src);
      if (m.cover === src) delete m.cover; mchanged(); }
    else if (act === 'pt') { const m = M(pid); m.did = m.did || {}; (m.did[LANG] = m.did[LANG] || []).push(T.np); mchanged();
      requestAnimationFrame(() => { const all = document.querySelectorAll('main [data-fs-x]'); const li = all[all.length - 1]; if (li) { deco(); li.focus(); document.execCommand('selectAll', false, null); } }); }
    else if (act === 'add') { const inp = document.getElementById('fs-file'); if (inp) inp.click(); }
  }, true);
  document.addEventListener('change', async e => {
    if (e.target.id === 'fs-file1' && assets) {
      const f = e.target.files[0], dk = e.target.dataset.dk; e.target.value = ''; if (!f || !dk) return;
      ui(T.up);
      try { const r = await assets.upload(f); M('__disc')[dk] = r.url; mchanged(); } catch (err) { ui('Couldn’t upload · try again'); }
      return;
    }
    if (e.target.id !== 'fs-file' || !assets) return;
    const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
    const page = document.querySelector('main .cs2[data-pid]'); if (!page) return; const pid = page.dataset.pid;
    let done = 0, failed = 0;
    for (const f of files) {
      ui(`${T.up} ${done + 1}/${files.length}`);
      try { const r = await assets.upload(f); const m = M(pid); (m.add = m.add || []).push({u: r.url, c: f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '), v: /^video\//.test(r.contentType || f.type) ? 1 : 0}); done++; }
      catch (err) { failed++; }
    }
    mchanged(); if (failed) ui(`${failed} file${failed > 1 ? 's' : ''} couldn’t upload · ${n()} unsaved`);
  });
  document.addEventListener('focusout', e => {
    const li = e.target.closest && e.target.closest('[data-fs-x]'); if (!li) return;
    const page = document.querySelector('main .cs2[data-pid]'); if (!page) return;
    const m = M(page.dataset.pid), arr = ((m.did = m.did || {})[LANG] = m.did[LANG] || []), i = +li.dataset.fsX, v = clean(li.innerHTML);
    if (!v || v === '<br>') arr.splice(i, 1); else arr[i] = v; mchanged();
  }, true);
  const later = () => { if (!scheduled) { scheduled = true; requestAnimationFrame(scan); } };
  new MutationObserver(later).observe(document.body, {childList:true, subtree:true, characterData:true});
  fetch('edits.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(d => { if (d && typeof d === 'object') { saved = {en:d.en||{}, es:d.es||{}}; media = d.media || {}; } applyMedia(); later(); }).catch(() => { applyMedia(); later(); });

  const bar = document.getElementById('fs-edbar'), msg = document.getElementById('fs-msg'),
        tg = document.getElementById('fs-toggle'), sv = document.getElementById('fs-save'), un = document.getElementById('fs-undo');
  const n = () => Object.keys(pending).length + (mpend ? 1 : 0);
  function ui(text){
    tg.textContent = editing ? 'Done' : 'Edit';
    sv.hidden = un.hidden = !n();
    sv.disabled = busy;
    msg.textContent = text || (n() ? `${n()} unsaved change${n() > 1 ? 's' : ''} · ${LANG.toUpperCase()}` : editing ? (LANG === 'es' ? `Haz clic en un texto o imagen · ES` : `Click any text or image · EN`) : (LANG === 'es' ? 'Editar página' : 'Edit page'));
  }
 function stash(){ try { const v = JSON.stringify({lang:LANG, p:pending, m:mpend}); sessionStorage.setItem(DRAFT, v); localStorage.setItem(DRAFT, v); } catch(e) {} }
  function unstash(){ try { sessionStorage.removeItem(DRAFT); localStorage.removeItem(DRAFT); } catch(e) {} }
  function commit(el){
    if (!el || !el.hasAttribute('data-fs-ed')) return;
    const key = el.dataset.fsKey, now = clean(el.innerHTML), base = (saved[LANG] || {})[key];
    if (now === key && base === undefined) delete pending[key];
    else if (now === (base !== undefined ? base : key)) delete pending[key];
    else pending[key] = now;
    stash(); later(); ui();
  }
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-fs-ed]'); if (el) el.dataset.fsLock = '1'; }, true);
  document.addEventListener('focusout', e => commit(e.target.closest && e.target.closest('[data-fs-ed]')), true);
  document.addEventListener('input', e => { const el = e.target.closest && e.target.closest('[data-fs-ed]'); if (el) { el.setAttribute('data-fs-dirty',''); msg.textContent = 'Editing…'; } }, true);
  document.addEventListener('keydown', e => { const el = e.target.closest && e.target.closest('[data-fs-ed]'); if (!el) return;
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { el.innerHTML = pending[el.dataset.fsKey] ?? (saved[LANG]||{})[el.dataset.fsKey] ?? el.dataset.fsKey; el.blur(); } }, true);
  document.addEventListener('paste', e => { const el = e.target.closest && e.target.closest('[data-fs-ed]'); if (!el) return;
    e.preventDefault(); const t = (e.clipboardData || window.clipboardData).getData('text/plain'); document.execCommand('insertText', false, t.replace(/\s+/g,' ')); }, true);
  document.addEventListener('click', e => { if (!editing) return; const el = e.target.closest('[data-fs-ed]'); if (el) { e.preventDefault(); e.stopPropagation(); } }, true);

  tg.addEventListener('click', () => { editing = !editing; document.body.classList.toggle('fs-editing', editing); if (!editing && document.activeElement) document.activeElement.blur(); scan(); ui(); });
  un.addEventListener('click', () => { pending = {}; mpend = null; unstash(); applyMedia();
    document.querySelectorAll('[data-fs-key]').forEach(el => { const b = (saved[LANG]||{})[el.dataset.fsKey]; el.innerHTML = b !== undefined ? b : el.dataset.fsKey; });
    scan(); ui('Changes discarded'); });
  sv.addEventListener('click', async () => {
    if (!art || busy || !n()) return;
    if (document.activeElement) document.activeElement.blur();
    busy = true; ui('Saving…');
    const next = {en:Object.assign({}, saved.en), es:Object.assign({}, saved.es), media: mpend || media};
    for (const [k, v] of Object.entries(pending)) { if (v === k) delete next[LANG][k]; else next[LANG][k] = v; }
    stash();
    try {
      await art.publish({'edits.json': {content: JSON.stringify(next, null, 1), contentType: 'application/json'}});
      saved = {en:next.en, es:next.es}; media = next.media; mpend = null; pending = {}; unstash(); busy = false; scan(); ui('Saved ✓ · live for everyone');
    } catch (err) {
      busy = false;
      const c = err && err.code;
      if (c === 'conflict') ui('A newer version was published · reloading');
      else if (c === 'not_writer' || c === 'not_granted') { ui('This view is read-only'); }
      else if (c === 'capability_disabled' || c === 'capability_removed' || c === 'not_declared')
        ui('Saving isn’t available in this view · changes kept on this device');
      else if (c === 'rate_limited') ui('Too many saves · try again in a minute');
      else ui('Couldn’t save · try again');
    }
  });

  (async () => {
    try {
      if (!window.claude || !window.claude.use) return;
      const [u, a] = await Promise.all([window.claude.use('user'), window.claude.use('artifact')]);
      const ok = u ? await u.canEdit() : false;
      if (!ok || !a) return;
      art = a; bar.hidden = false; ui();
      try { assets = await window.claude.use('assets'); } catch(e) { assets = null; } later();
      if (n()) { later(); ui(); }
    } catch(e) {}
  })();
})();
